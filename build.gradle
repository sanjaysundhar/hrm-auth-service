buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.liquibase:liquibase-core:5.0.1"
    }
}
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.11'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.hibernate.orm' version '6.6.41.Final'
    id 'org.graalvm.buildtools.native' version '0.10.6'
    id 'org.liquibase.gradle' version '3.1.0'
}

group = 'com.hrm.auth_service'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    implementation 'org.liquibase:liquibase-core'
    compileOnly 'org.projectlombok:lombok'
    implementation "org.mapstruct:mapstruct:1.5.5.Final"

    // Pinned to 42.7.7 for PostgreSQL 18 support
    runtimeOnly 'org.postgresql:postgresql:42.7.7'

    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor "org.mapstruct:mapstruct-processor:1.5.5.Final"

    liquibaseRuntime 'org.springframework.boot:spring-boot-starter-data-jpa'
    liquibaseRuntime 'org.liquibase:liquibase-core'
    liquibaseRuntime 'info.picocli:picocli:4.7.7'
    liquibaseRuntime 'org.liquibase.ext:liquibase-hibernate6:5.0.1'

    // Pinned to 42.7.7 for PostgreSQL 18 support
    liquibaseRuntime 'org.postgresql:postgresql:42.7.7'

    liquibaseRuntime sourceSets.main.output

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def springProperties = new Properties()
file('src/main/resources/application.properties').withInputStream { springProperties.load(it) }
def propertiesFile = file('src/main/resources/application-dev.properties')
if (propertiesFile.exists()) {
    propertiesFile.withInputStream { springProperties.load(it) }
}

def physicalStrategy = "org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy"
def implicitStrategy = "org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy"
def devSchema = springProperties.getProperty('dev.liquibase.schema')

liquibase {
    activities {
        register("main") {
            url springProperties.getProperty('spring.datasource.url') + "?currentSchema=${devSchema}"
            username springProperties.getProperty('spring.datasource.username')
            password springProperties.getProperty('spring.datasource.password')
            driver "org.postgresql.Driver"
            referenceDriver "liquibase.ext.hibernate.database.connection.HibernateDriver"
            referenceUrl "hibernate:spring:${group}?dialect=org.hibernate.dialect.PostgreSQLDialect" +
                    "&hibernate.physical_naming_strategy=${physicalStrategy}" +
                    "&hibernate.implicit_naming_strategy=${implicitStrategy}" +
                    "&hibernate.id.db_structure_naming_strategy=legacy" +
                    "&hibernate.default_schema=${devSchema}"
            defaultSchemaName devSchema
            changelogFile 'src/main/resources/db/diff.xml'
            excludeObjects "global_wallets_mview"
        }
        runList = "main"
    }
}

tasks.named('diffChangelog') {
    doFirst {
        delete 'src/main/resources/db/diff.xml'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}